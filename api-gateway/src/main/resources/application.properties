server.port=8080
spring.application.name=api-gateway

# Downstream service base URLs (overridden by Docker env vars)
app.service.customer=${APP_SERVICE_CUSTOMER:http://localhost:8081}
app.service.car=${APP_SERVICE_CAR:http://localhost:8082}
app.service.renting=${APP_SERVICE_RENTING:http://localhost:8083}

# JWT
app.jwt.secret=${APP_JWT_SECRET:fucar-super-secret-key-minimum-256-bits-long!!}
app.jwt.expiration-ms=86400000

# Admin account (stored here, NOT in DB)
app.admin.email=${APP_ADMIN_EMAIL:admin@fucar.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# Spring Cloud Gateway routes
spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=${APP_SERVICE_CUSTOMER:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.routes[1].id=car-service
spring.cloud.gateway.routes[1].uri=${APP_SERVICE_CAR:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/cars/**,/api/manufacturers/**,/api/suppliers/**

spring.cloud.gateway.routes[2].id=renting-service
spring.cloud.gateway.routes[2].uri=${APP_SERVICE_RENTING:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rentings/**

# Disable Spring Security default auto-config (we handle auth manually via GlobalFilter)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

# Logging
logging.level.com.fucar.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
