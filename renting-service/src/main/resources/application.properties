server.port=8083
spring.application.name=renting-service

# DataSource — override via env var SPRING_DATASOURCE_URL in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/renting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fucar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fucar123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Inter-service URLs — override in Docker via env vars
app.service.customer=${CUSTOMER_SERVICE_URL:http://localhost:8081}
app.service.car=${CAR_SERVICE_URL:http://car-service:8082}
