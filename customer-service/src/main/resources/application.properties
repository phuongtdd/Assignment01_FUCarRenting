server.port=8081
spring.application.name=customer-service

# DataSource — override via env var SPRING_DATASOURCE_URL in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fucar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fucar123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT secret — must match api-gateway
app.jwt.secret=fucar-super-secret-key-minimum-256-bits-long!!
